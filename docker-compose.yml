services:
  # ==========================================
  # 1. PostgreSQL Veritabanı
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: minierp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minierp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minierp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minierp-net

  # ==========================================
  # 2. RabbitMQ Mesaj Kuyruğu
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: minierp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP bağlantı portu
      - "15672:15672"  # RabbitMQ Web Yönetim Paneli
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minierp-net

  # ==========================================
  # 3. Spring Boot Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minierp-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Veritabanı (Docker network'te service adıyla erişilir)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: minierp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_ENABLED: "true"
      # JWT
      JWT_SECRET: bWluaWVycC1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI2LXByb2R1Y3Rpb24tZ3JhZGU=
      JWT_EXPIRATION: 86400000
      # JVM Ayarları
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - minierp-net

  # ==========================================
  # 4. React + Nginx Kurumsal Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minierp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - minierp-net

volumes:
  pgdata:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  minierp-net:
    driver: bridge

